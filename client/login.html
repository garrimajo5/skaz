<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b2b"><title>Вход — СКАЗ</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="local.css"><link rel="stylesheet" href="login.css"></head>
<body data-theme="polar"><main class="account-card"><div class="overline">СКАЗ · ДНЕВНИК ПРИКЛЮЧЕНИЯ</div><h1>Вернуться к своей истории</h1><p>Войди в свой аккаунт. Листы персонажей и черновики откроются после входа.</p><form id="login-form"><label for="login-name">Логин</label><input id="login-name" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" minlength="3" maxlength="64" required autofocus><label for="login-password">Пароль</label><input id="login-password" name="password" type="password" autocomplete="current-password" minlength="15" maxlength="256" required><p id="login-status" role="status" aria-live="polite"></p><button class="primary" type="submit">Войти</button></form><p class="small">Аккаунт и доступ к героям назначает владелец сервера. Самостоятельная регистрация пока недоступна.</p><div class="themes" aria-label="Тема входа"><button data-login-theme="polar">Полярис</button><button data-login-theme="atlas">Атлас</button><button data-login-theme="coal">Уголь</button></div></main><script src="login.js"></script></body></html>
