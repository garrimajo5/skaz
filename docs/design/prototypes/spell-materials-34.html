<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>СКАЗ — материалы заклинаний</title><link rel="stylesheet" href="/fonts.css"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/catalog.css"><style>
body{padding:24px}main{max-width:1280px;margin:auto}.prototype-note{color:var(--muted);max-width:75ch}.toolbar{display:flex;gap:16px;flex-wrap:wrap;margin:24px 0}.toolbar label{display:grid;gap:6px;flex:1;min-width:200px}.toolbar select,.toolbar input{width:100%;min-height:46px}.material-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:18px}.catalog-tile-open{height:100%;text-align:left}.catalog-tile-heading img{width:88px;height:88px;object-fit:contain;flex:none}.material-lines{display:grid;gap:12px;border-top:1px solid var(--line);padding-top:16px;width:100%}.material-lines small{display:block;color:var(--muted);font-size:13px}.material-lines span{font-size:15px;overflow-wrap:anywhere}.material-badge{border:1px solid var(--accent);border-radius:8px;padding:5px 9px;color:var(--accent);font-size:13px}.catalog-tile-heading strong{font-size:23px}.catalog-tile-read{margin-top:auto}dialog{max-width:min(640px,calc(100vw - 32px));width:100%;max-height:90dvh;color:var(--text);background:var(--panel);padding:0;border:1px solid var(--line);border-radius:16px}dialog::backdrop{background:#0009}.dialog-inner{padding:24px;max-height:75dvh;overflow:auto;overflow-wrap:anywhere}dialog h2{padding-right:30px}.close-row{display:flex;justify-content:flex-end;padding:12px;background:var(--panel);border-bottom:1px solid var(--line)}button{min-height:44px}dialog dd{margin:4px 0 18px}dialog dt{color:var(--muted)}dialog a{color:var(--accent)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}#status{min-height:1.5em}@media(max-width:450px){body{padding:16px}.toolbar{gap:12px}.catalog-tile-heading{gap:12px}}
</style></head><body data-theme="polar"><main><h1>Материалы заклинаний</h1><p class="prototype-note">Образец карточек: стоимость и расход показаны отдельно. Эта страница не меняет героя и не списывает вещи. Данные 20 заклинаний прошли независимую проверку; остальные условия не считаются заполненными.</p><div class="toolbar"><label>Поиск<input id="search" type="search" placeholder="Название заклинания"></label><label>Расход<select id="filter"><option value="all">Все варианты</option><option value="retained">Сохраняется</option><option value="consumed">Расходуется</option><option value="partial">Частичный расход</option><option value="conditional">Расход по условию</option><option value="unknown">Не уточнён</option></select></label><label>Тема<select id="theme"><option value="polar">Полярис</option><option value="coal">Уголь</option><option value="atlas">Атлас</option></select></label></div><p id="status" role="status">Загрузка примеров…</p><section id="cards" class="material-grid" aria-label="Карточки заклинаний"></section></main><dialog id="details" aria-labelledby="detail-title"><div class="close-row"><button id="close" autofocus>Закрыть</button></div><div id="detail-body" class="dialog-inner"></div></dialog><script type="module" src="/material-prototype.mjs"></script></body></html>
