<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>СКАЗ · пилот иллюстраций</title><link rel="stylesheet" href="/fonts.css"><style>
*{box-sizing:border-box}body{--bg:#101b2b;--panel:#17263a;--text:#edf4fc;--muted:#9fb3ca;--accent:#8ce2d2;background:var(--bg);color:var(--text);font:14px/1.5 Inter,sans-serif;margin:0}body[data-theme=coal]{--bg:#141817;--panel:#1d2220;--text:#eeeee5;--muted:#a4afa6;--accent:#d9bc7c}body[data-theme=atlas]{--bg:#f1eee5;--panel:#faf8f0;--text:#263f38;--muted:#52665b;--accent:#466d54}header,footer{padding:20px 24px}h1{font:28px 'PT Serif',serif;margin:0 0 8px}p{margin:8px 0;color:var(--muted)}.controls{display:flex;flex-wrap:wrap;gap:16px;align-items:center}label{display:flex;align-items:center;gap:8px;min-height:44px}select{font:inherit;min-height:44px;background:var(--panel);color:var(--text);border:1px solid var(--muted);border-radius:8px;padding:8px}input{width:22px;height:22px}select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;padding:0 24px}article{background:var(--panel);padding:12px;border:1px solid var(--muted);border-radius:12px;min-width:0}h2{font-size:14px;line-height:1.3;margin:8px 0;min-height:36px}img.large{display:block;width:100%;height:130px;object-fit:contain}.samples{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.samples img{object-fit:contain;flex:none}.gray img{filter:grayscale(1)}small{color:var(--muted)}.round{border-radius:50%;padding:7px;background:#343d42}footer{color:var(--muted)}@media(max-width:430px){main{grid-template-columns:repeat(2,minmax(0,1fr));padding:0 12px}.samples{gap:6px}article{padding:8px}img.large{height:110px}}
</style><header><h1>СКАЗ · пилот иллюстраций</h1><p id="status">Загрузка списка…</p><div class="controls"><label>Тема<select id="theme"><option value="polar">Полярис</option><option value="coal">Уголь</option><option value="atlas">Атлас</option></select></label><label><input id="gray" type="checkbox">Без цвета</label></div><p>Кандидаты на стиль · миниатюры 32/48 px · игровой функционал не подключён</p></header><main id="gallery"></main><footer id="missing"></footer><script>
const text=(tag,value)=>{const el=document.createElement(tag);el.textContent=value;return el;};
fetch('/candidates.json').then(r=>{if(!r.ok)throw Error();return r.json();}).then(data=>{
 document.getElementById('status').textContent=`Создано ${data.entries.length} из 24 образцов. Принятых в рабочую библиотеку: 0.`;
 for(const record of data.entries){const slug=record.id.split(':').at(-1);if(!/^[a-z]+(?:-[a-z]+)*$/.test(slug))continue;const card=document.createElement('article');const large=new Image();large.src='/'+slug+'.png';large.alt=record.name.ru;large.width=130;large.height=130;large.className='large';card.append(large,text('h2',record.name.ru));const row=document.createElement('div');row.className='samples';for(const size of [32,48]){const image=new Image();image.src=large.src;image.alt='';image.width=size;image.height=size;row.append(image);}if(record.id.includes(':monster:')){const token=new Image();token.src=large.src;token.alt='Круглый жетон';token.width=48;token.height=48;token.className='round';row.append(token);}card.append(row);document.getElementById('gallery').append(card);}
 document.getElementById('missing').textContent='Ещё не созданы: сова, студенистый куб, огненный элементаль, древний красный дракон, призрак. Генератор вернул 403. Исходники локальные, не оптимизированы для игровой загрузки.';
}).catch(()=>document.getElementById('status').textContent='Не удалось загрузить список. Проверь локальный сервер.');
document.getElementById('theme').addEventListener('change',e=>document.body.dataset.theme=e.target.value);document.getElementById('gray').addEventListener('change',e=>document.body.classList.toggle('gray',e.target.checked));
</script></html>
