<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>СКАЗ — аудит палитры</title>
<link rel="stylesheet" href="/client/fonts.css"><link rel="stylesheet" href="/client/style.css"><link rel="stylesheet" href="/client/quick.css">
<style>body{padding:24px}main{padding:0;max-width:1100px;margin:auto}.samples{display:flex;flex-wrap:wrap;gap:16px;padding:20px}.sample{padding:12px}.results{border-collapse:collapse;width:100%;font-size:14px}.results td,.results th{padding:8px;text-align:left;border-bottom:1px solid var(--line)}.results [data-fail=true]{font-weight:700}.fixtures{margin:20px 0}.audit-select{border:2px solid var(--accent);color:var(--accent)}.audit-pending{color:var(--warn)}.audit-conflict{color:var(--red)}#focus-sample:focus-visible{outline:2px solid var(--accent);outline-offset:3px}pre{white-space:pre-wrap;overflow-wrap:anywhere}h1{font-size:26px}</style>
<body data-theme="polar"><main><h1>Аудит цветов СКАЗ</h1><p>Изолированные образцы реальных CSS. Проверка всей игры и фоновых градиентов выполняется отдельно.</p>
<nav aria-label="Тема"><button data-theme-choice="polar">Полярис</button> <button data-theme-choice="coal">Уголь</button> <button data-theme-choice="atlas">Атлас</button></nav>
<div class="panel fixtures"><div class="samples">
<span class="sample" data-audit="Основной текст">Название заклинания</span><span class="sample" style="color:var(--muted)" data-audit="Вторичный текст">Дистанция и источник</span>
<button data-audit="Обычная кнопка">Открыть карточку</button><button class="primary" data-audit="Основное действие">Сотворить</button>
<button class="audit-select" data-audit="Выбранность" aria-pressed="true">В бою</button>
<button disabled data-audit="Недоступная обычная">Нет ячеек 2+</button><button class="primary" disabled data-audit="Недоступная основная">Недоступно</button>
<span class="sample audit-pending" data-audit="Ждёт сети">◷ Ждёт сети</span><span class="sample audit-conflict" data-audit="Конфликт">! Конфликт: обновите данные</span>
<span class="sample" style="color:var(--temporary)" data-audit="Временные хиты">Щит +5</span><span class="sample" style="color:var(--tracker-sand)" data-audit="Вдохновение">◆ Вдохновение 2/4</span>
<button id="focus-sample" data-audit="Кнопка фокуса">Проверить фокус клавишей Tab</button></div></div>
<h2 id="result-title">Результаты</h2><table class="results"><thead><tr><th>Образец</th><th>Текст / фон</th><th>Контраст</th><th>Цель</th><th>Итог</th></tr></thead><tbody id="results"></tbody></table>
<details><summary>Воспроизводимый JSON</summary><pre id="report"></pre></details>
<script src="/scripts/theme-contrast.js"></script><script>
const canvas=document.createElement('canvas');canvas.width=canvas.height=1;const ctx=canvas.getContext('2d',{willReadFrequently:true});
function rgba(css){ctx.clearRect(0,0,1,1);ctx.fillStyle=css;ctx.fillRect(0,0,1,1);const p=Array.from(ctx.getImageData(0,0,1,1).data);p[3]/=255;return p;}
function background(el){if(!el)return [255,255,255,1];return SkazContrast.composite(rgba(getComputedStyle(el).backgroundColor),background(el.parentElement));}
function run(){const rows=[...document.querySelectorAll('[data-audit]')].map(el=>{const s=getComputedStyle(el),parent=background(el.parentElement),own=background(el),opacity=Number(s.opacity),bg=SkazContrast.composite([...own.slice(0,3),opacity],parent),text=SkazContrast.composite(rgba(s.color),own),fg=SkazContrast.composite([...text.slice(0,3),opacity],parent),ratio=SkazContrast.ratio(fg,bg);return {sample:el.dataset.audit,color:s.color,background:s.backgroundColor,opacity,foreground:fg,compositedBackground:bg,ratio:Number(ratio.toFixed(3)),target:4.5,pass:ratio>=4.5};});
const panel=background(document.querySelector('.fixtures')),focus=rgba(getComputedStyle(document.body).getPropertyValue('--accent').trim());rows.push({sample:'Фокус: акцент на панели',color:getComputedStyle(document.body).getPropertyValue('--accent').trim(),background:getComputedStyle(document.querySelector('.fixtures')).backgroundColor,ratio:Number(SkazContrast.ratio(focus,panel).toFixed(3)),target:3,pass:SkazContrast.ratio(focus,panel)>=3});
document.getElementById('results').replaceChildren(...rows.map(r=>{const tr=document.createElement('tr');tr.dataset.fail=!r.pass;for(const v of [r.sample,r.color+' / '+r.background,r.ratio,r.target,r.pass?'OK':'НЕ ПРОШЁЛ']){const td=document.createElement('td');td.textContent=v;tr.append(td);}return tr;}));
const report={theme:document.body.dataset.theme,scope:'flat CSS fixtures; own opacity composited; no ancestor opacity, gradients or hover simulation',rows};document.getElementById('report').textContent=JSON.stringify(report,null,2);document.getElementById('result-title').textContent='Тема '+report.theme+': '+rows.filter(r=>!r.pass).length+' несоответствий';}
for(const b of document.querySelectorAll('[data-theme-choice]'))b.addEventListener('click',()=>{document.body.dataset.theme=b.dataset.themeChoice;for(const x of document.querySelectorAll('[data-theme-choice]'))x.setAttribute('aria-pressed',x===b);run();});document.fonts.ready.then(run);
</script></main></body></html>
